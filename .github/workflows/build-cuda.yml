name: Build CUDA binaries

on:
  workflow_dispatch:   # manually trigger karne ke liye button milega Actions tab mein

jobs:
  build-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.0'

      - name: Configure
        run: cmake -B build -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j --target llama-cli llama-server

      - name: Package
        run: |
          mkdir output
          cp build/bin/llama-cli build/bin/llama-server output/

      - uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-binaries
          path: output/
